<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard · EcoShelf</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <div id="navbar-root"></div>
    <main class="app-main">
      <header class="app-header">
        <div>
          <span class="tag-chip">Shelf overview</span>
          <h1 class="display">Good to see you, <span id="user-greeting">friend</span>.</h1>
          <p class="lede small">Here's what your pantry is telling us today.</p>
        </div>
        <a class="btn btn-primary" href="add-product.html">+ Add product</a>
      </header>

      <section class="stat-grid" id="stat-grid"></section>

      <section class="panel-grid">
        <article class="panel">
          <h2 class="panel-title">Risk distribution</h2>
          <div id="risk-bars" class="risk-bars"></div>
        </article>
        <article class="panel">
          <h2 class="panel-title">Recent activity</h2>
          <ul id="activity-feed" class="activity"></ul>
        </article>
      </section>
    </main>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
